name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  shared-checks:
    name: Shared constants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check domain constants are in sync
        run: python3 scripts/check_domain_constants.py

      # This repository is public. data/club/members.csv was tracked for one commit
      # before anyone noticed; it happened to hold placeholders. This fails the build if
      # the club's data, a backup, a .env or a real email address is ever tracked again.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: No private data in the repository
        run: npm run check:private

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        # Advisory, not blocking: a transitive advisory with no patched release
        # must not stop unrelated work. Review anything reported here.
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # Deliberately no `env:` block. The build must succeed with no environment
      # variables at all, because that is exactly the state a fresh deploy of the
      # site builds in. Placeholders here would hide a regression that only the club would
      # find, on their own site.
      - name: Build (no environment variables — as a fresh deploy does)
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 5

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        # Advisory, not blocking: a transitive advisory with no patched release
        # must not stop unrelated work. Review anything reported here.
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  # The deployment target itself. `npm test` exercises the Express app directly,
  # which bypasses the layer that actually broke: serverless-http translating a
  # function invocation, and the container choosing a store when no credentials
  # exist. This runs the API the way Appwrite does, with nothing configured — the
  # state a first deploy is in.
  #
  # This replaced a Firebase rules dry-run that needed two repository secrets which
  # were never configured, so it warned and passed on every run without checking
  # anything.
  function:
    name: API as a serverless function
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root and backend dependencies
        run: npm install && npm --prefix backend ci

      - name: Build the backend
        run: npm --prefix backend run build

      - name: Invoke the function with no credentials
        run: npm run test:function

  # A hosting platform that cannot scope variables per build step hands every
  # variable a site has to the build environment — including the Appwrite server key. Vite only
  # inlines VITE_-prefixed values, which keeps it out of the bundle. That guarantee
  # sits between a live credential and a public CDN, so it is tested rather than
  # remembered.
  bundle-secrets:
    name: No secrets in the browser bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build with canary credentials and search the output
        run: npm run check:bundle
