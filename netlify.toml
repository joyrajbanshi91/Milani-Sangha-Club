# ---------------------------------------------------------------------------
# Netlify deployment. This is the only deployment configuration in the repository.
#
# Netlify serves the built PWA as static files and runs the Express API as a
# function, so the whole application — public website, member sign-in and the
# finance area — works from one origin on the free tier.
#
# ## A deploy needs no environment variables
#
# Push, and the site comes up. With no database configured the API serves the
# embedded demo ledger and offers demo sign-in, and every signed-in page carries a
# banner saying so. That is deliberate: nothing here should be able to turn a
# missing variable into a site that will not start.
#
# To connect a real database, add its variables in the Netlify dashboard
# (Project configuration → Environment variables) and redeploy. Secrets belong there,
# never in this file — it is committed. The full list is in docs/09-netlify.md.
# ---------------------------------------------------------------------------

[build]
  # Both workspaces are installed and built. The backend is compiled first, because
  # the function imports backend/dist.
  #
  # `install:all` matters twice over. This repository holds two npm projects and
  # declares no workspaces, so a plain `npm install` installs the root only and the
  # build dies at `vite: not found`. And that script passes `--include=dev`, because
  # `tsc` and `vite` are devDependencies: with `NODE_ENV=production` in the build
  # environment npm omits devDependencies entirely and the build dies instead at
  # `tsc: command not found`. Both failures name a tool rather than the cause, which
  # is what makes them expensive.
  command = "npm run install:all && npm --prefix backend run build && npm --prefix frontend run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  # Node version comes from .nvmrc (24), which Netlify reads, so it is not repeated
  # here — two copies of a version number drift. Netlify's own default satisfies
  # the `engines` field in both package.json files anyway.

  # Compiled into the browser bundle. A relative path keeps the API same-origin via
  # the redirect below, so CORS is never exercised. This matches the default in
  # frontend/src/config/env.ts; it is stated anyway because someone reading this
  # file should be able to see where the browser sends its requests.
  VITE_API_BASE_URL = "/api/v1"

[functions]
  node_bundler = "esbuild"
  # Nothing is externalised, and that matters. firebase-admin used to be, because it
  # is large and pulls in optional native dependencies. Shipped as a raw node_module
  # it was then loaded by CommonJS `require` at runtime, and its own dependency chain
  # — jwks-rsa requiring the now ESM-only `jose` — threw ERR_REQUIRE_ESM before a
  # single line of this application ran. Every route answered 502, including health.
  #
  # firebase-admin has been removed from the project entirely: the ledger is in
  # Appwrite, and node-appwrite is plain JavaScript that esbuild bundles cleanly.

# /api/** reaches the function. Must come BEFORE the SPA fallback: the first
# matching rule wins, so a catch-all above this would swallow every API call and
# return index.html — which is exactly the "Could not reach the club's server"
# failure this arrangement exists to avoid.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

# Single-page app: every other path is served by index.html so React Router can
# handle it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Headers.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# A stale service worker would pin visitors to an old build indefinitely.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

    # ---------------------------------------------------------------------
    # TEMPORARY — remove this when the content has been reviewed.
    #
    # The site had to be made publicly reachable: Netlify SSO answered 401 to
    # every path including /api/v1/**, so the browser could not reach its own
    # API and the login page reported "Could not reach the club's server".
    #
    # But the copy is still placeholder, so it must not be indexed under the
    # club's name yet. This header is the enforceable half of that; the other
    # half is frontend/public/robots.txt, which a crawler may ignore.
    #
    # Removing this and restoring robots.txt is step 2 and 3 of going live —
    # see the header of that file.
    # ---------------------------------------------------------------------
    X-Robots-Tag = "noindex, nofollow, noarchive"
